<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>탁재훈론 훈련장</title>
<meta name="description" content="상대의 말에서 영상이 멈추면 내 답을 먼저 해 보는 탁재훈론 훈련장">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1ede3; --card:#fffdf8; --ink:#1d2a2e; --sub:#5b6a6e; --line:#e3ddcf;
  --acc:#0b5563; --acc-soft:#dcebee; --acc-ink:#ffffff;
  --tip:#a85a08; --tip-soft:#fcefd9;
  --warn:#9a3412; --warn-soft:#fae8df;
  --ts:#8a969a; --shadow:0 6px 24px rgba(20,40,45,.10);
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --card:#1a2326; --ink:#e7ecec; --sub:#9fb0b4; --line:#2a3639;
    --acc:#6fc3d1; --acc-soft:#1e3a40; --acc-ink:#0c1a1d;
    --tip:#f0b25f; --tip-soft:#33291a;
    --warn:#f0997a; --warn-soft:#33201a;
    --ts:#78888c; --shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --card:#1a2326; --ink:#e7ecec; --sub:#9fb0b4; --line:#2a3639;
  --acc:#6fc3d1; --acc-soft:#1e3a40; --acc-ink:#0c1a1d;
  --tip:#f0b25f; --tip-soft:#33291a;
  --warn:#f0997a; --warn-soft:#33201a;
  --ts:#78888c; --shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:var(--fs);line-height:1.75;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
.cards-app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}

/* ---------- 목차 ---------- */
#home{overflow-y:auto;height:100%;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{padding:20px 4px 22px}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--acc);font-weight:700}
.hero h1{margin:6px 0 8px;font-size:40px;line-height:1.15;font-weight:900;letter-spacing:-.02em}
.hero p{margin:0;color:var(--sub);font-size:15px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:6px 0 18px;padding:14px 16px;background:var(--acc);color:var(--acc-ink);border:0;border-radius:14px;font-weight:700;text-align:left}
.resume small{display:block;font-weight:400;opacity:.85}
.tile{display:flex;gap:14px;width:100%;margin:0 0 10px;padding:14px 14px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.tile:active{transform:scale(.99)}
.tile .no{flex:0 0 44px;height:44px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:900;font-size:18px}
.tile .tx{min-width:0;flex:1}
.tile b{display:block;font-size:17px;line-height:1.35}
.tile .s{display:block;color:var(--sub);font-size:13.5px;line-height:1.5;margin-top:2px}
.tile .m{display:block;color:var(--ts);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:12px;line-height:1;padding:5px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:500;white-space:nowrap}
.foot{margin:22px 4px 0;color:var(--sub);font-size:13px;line-height:1.7}
.foot a{color:var(--acc);font-weight:700}

/* ---------- 덱 ---------- */
#deck{display:none;height:100%;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar .back{border:0;background:transparent;padding:8px 10px;border-radius:10px;font-weight:700;color:var(--acc)}
.bar .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:15px;text-align:center}
.bar .pos{font-size:13px;color:var(--sub);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.bar .fs{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:34px;font-weight:700}
.prog{height:3px;background:var(--line);margin:0 12px;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#stage{flex:1;overflow-y:auto;padding:14px 14px 18px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px 22px;box-shadow:var(--shadow);animation:in .22s ease-out}
.card.l{animation-name:inl}
@keyframes in{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--acc);color:var(--acc-ink);line-height:1}
.badge.tip{background:var(--tip)}
.badge.caution{background:var(--warn)}
.badge.more,.badge.concept,.badge.notice,.badge.closing{background:var(--sub)}
.sec{font-size:13px;color:var(--sub)}
.card h2{margin:2px 0 14px;font-size:21px;line-height:1.4;font-weight:900;letter-spacing:-.01em}
.card h2 .ar{color:var(--acc);padding:0 .15em}
.card p{margin:0 0 .95em}
.card p:last-child{margin-bottom:0}
.note{font-size:.92em;color:var(--sub)}
.ts{display:inline-block;font-size:11.5px;color:var(--ts);background:transparent;border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.55;margin:0 1px;vertical-align:baseline;white-space:nowrap;font-weight:400}
.quote{margin:4px 0 16px;padding:12px 14px;background:var(--acc-soft);border-left:4px solid var(--acc);border-radius:4px 14px 14px 4px}
.quote p{margin:0 0 .45em;font-weight:500}
.quote p:last-of-type{margin-bottom:.2em}
.quote .ts{display:block;border:0;padding:0;margin-top:6px;font-size:11.5px}
figure{margin:0 0 16px}
video{display:block;width:100%;max-height:62vh;background:#000;border-radius:14px}
figcaption{font-size:12px;color:var(--ts);margin-top:6px}
.ex{margin:0 0 .8em;padding:10px 12px;background:var(--tip-soft);border-radius:12px;font-size:.96em}
.ex b{display:inline-block;margin-right:8px;font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--tip);color:#fff}
.card.tip{border-color:var(--tip)}
.card.caution{border-color:var(--warn)}
ul.li,ol.li{margin:0 0 1em;padding-left:1.2em}
ul.li li,ol.li li{margin:0 0 .55em;padding-left:.15em}
ul.li li b{color:var(--acc)}
.cover{padding:30px 20px 30px;text-align:left;background:linear-gradient(160deg,var(--card) 0%,var(--acc-soft) 160%)}
.cover .no{font-size:13px;letter-spacing:.2em;color:var(--acc);font-weight:900}
.cover h2{font-size:32px;margin:6px 0 8px;line-height:1.25}
.cover .subt{color:var(--sub);font-size:16px;margin:0 0 18px}
.cover .hint{margin-top:18px;color:var(--ts);font-size:13px}
.reveal{display:block;width:100%;margin:6px 0 14px;padding:14px;border:2px dashed var(--acc);background:transparent;border-radius:14px;color:var(--acc);font-weight:700}
.answer[hidden],.reveal[hidden]{display:none}
.closing h2{font-size:26px}

.nav{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.nav button{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700}
.nav .next{flex:1.6;background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.nav button:disabled{opacity:.35}
.nav .lst{flex:.9}


/* ---------- 스크롤 본문 ---------- */
.bar{position:relative;z-index:5;background:var(--bg)}
.bar .lstb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;height:34px;font-weight:700;font-size:13.5px}
.page{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 18px 8px;box-shadow:var(--shadow)}
.chhead{padding:22px 0 20px;border-bottom:1px solid var(--line)}
.chhead .no{font-size:13px;letter-spacing:.2em;color:var(--acc);font-weight:900}
.chhead h1{margin:6px 0 6px;font-size:30px;line-height:1.25;font-weight:900;letter-spacing:-.02em}
.chhead .subt{color:var(--sub);margin:0 0 14px}
.chhead p{margin:0 0 .9em}
.seg{padding:24px 0 26px;border-bottom:1px solid var(--line);scroll-margin-top:8px}
.seg:last-child{border-bottom:0}
.seg.tip{margin:14px -8px;padding:18px 14px 18px;border:0;border-radius:16px;background:var(--tip-soft)}
.seg.tip .ex{background:var(--card)}
.seg.caution{margin:14px -8px;padding:18px 14px 18px;border:0;border-radius:16px;background:var(--warn-soft)}
.seg.more{padding-top:18px}
.seg h2{margin:2px 0 14px;font-size:20px;line-height:1.4;font-weight:900;letter-spacing:-.01em}
.seg h2 .ar{color:var(--acc);padding:0 .15em}
.seg p{margin:0 0 .95em}
.seg p:last-child{margin-bottom:0}
.seg .note{font-size:.92em;color:var(--sub)}
.endnav{display:flex;gap:10px;padding:18px 0 12px}
.endnav button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700}
.endnav .nx{flex:1.7;background:var(--acc);color:var(--acc-ink);border-color:var(--acc);padding:8px 12px;line-height:1.4}
.intro{display:block;width:100%;margin:0 0 14px;padding:11px 14px;background:transparent;border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:14px;text-align:left}


/* chnav8 */
.chnav{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:2px 12px 9px}
.chnav button{height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:700;color:var(--acc);padding:0}
.chnav button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* ---------- 목록 시트 ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:720px;max-height:78dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:14px 12px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:4px 8px 10px;font-size:15px}
.sheet button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:11px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0}
.sheet button.cur{background:var(--acc-soft)}
.sheet .n{flex:0 0 26px;color:var(--ts);font-size:13px;font-variant-numeric:tabular-nums}
.sheet .k{flex:0 0 auto;font-size:11.5px;color:var(--acc);font-weight:700}
.sheet .tt{flex:1;min-width:0;font-size:14.5px;line-height:1.45}
@media (min-width:760px){
  body{font-size:17px}
  .card{padding:28px 30px 30px}
  .cover h2{font-size:38px}
}

/* 훈련장 */
.dq p{margin:0 0 .5em}
.dq b{display:inline-block;min-width:3.2em;margin-right:6px;font-size:.86em;color:var(--acc)}
.dq.ans{background:var(--tip-soft);border-left-color:var(--tip)}
.dq.ans b{color:var(--tip)}
.stopmsg{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-size:13px;font-weight:700}
.seg h3{margin:18px 0 8px;font-size:16px;line-height:1.45;font-weight:900}
.seg h3:first-child{margin-top:4px}
.src a,.lk a{color:var(--acc);font-weight:700;text-decoration:none}
.ex b.l{background:var(--acc)}
.back-book{display:inline-block;margin:0 0 6px;color:var(--acc);font-weight:700;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="cards-app" id="app">
  <section id="home"></section>
  <section id="deck">
    <div class="bar">
      <button class="back" id="back" aria-label="목차로">‹ 목차</button>
      <div class="t" id="ttl"></div>
      <button class="fs" id="fs" aria-label="글자 크기">가</button>
      <button class="lstb" id="lst">목록</button>
    </div>
    <nav class="chnav" id="chnav" aria-label="장 바로가기"></nav>
    <div class="prog"><i id="pg"></i></div>
    <main id="stage"></main>
  </section>
</div>
<div class="sheet" id="sheet"><div class="box" id="sbox"></div></div>

<script>
const DATA = {"chapters": [{"title": "이 훈련장을 쓰는 법", "sub": "보고, 멈추고, 내가 먼저 말한다", "tags": [], "cards": [{"type": "cover", "blocks": [{"t": "p", "x": "본편이 탁재훈의 기술을 설명하는 책이라면, 여기는 그 기술을 내 입으로 해 보는 곳입니다. 기술 장을 하나 골라 위아래로 읽으면 됩니다."}, {"t": "ol", "items": ["상황 설명을 읽고 영상을 재생합니다.", "영상은 상대의 말이 끝난 곳에서 한 번 멈춥니다. 대화 상자에도 상대의 말까지만 보입니다.", "탁재훈이라면 뭐라고 했을지, 내가 그 자리에 있었다면 뭐라고 할지 소리 내어 말해 봅니다.", "‘정답 보기’를 눌러 실제로 나온 말과 왜 통했는지를 확인합니다. 영상을 다시 재생하면 끝까지 나옵니다."]}, {"t": "p", "x": "장면은 본편에 실린 38개와, 2023~2026년 공식 채널 영상 14편에서 새로 고른 60개입니다. 각 기술 장에서 본편 장면이 먼저 나오고 새 장면이 이어집니다. 본편의 기술 번호(①~⑪)를 그대로 씁니다. 맨 뒤에는 같은 기술이 통한 장면과 안 통한 장면을 나란히 둔 비교 장과, 김예원이 3년 만에 다시 나온 회차를 비교한 장이 있습니다."}, {"t": "note", "x": "대사는 유튜브 자막과 음성인식(Whisper) 두 가지로 확인했습니다. 누가 말했는지는 영상 문맥으로 판단한 추정이라 틀릴 수 있습니다."}]}]}, {"no": "①", "title": "소리 비틀기", "sub": "비슷한 소리의 다른 말로 받는다.", "meta": "장면 5개", "tags": ["예상 못 한 질문을 받았을 때", "상대가 더 세게 받아칠 때", "여러 사람이 동시에 대화할 때"], "cards": [{"type": "cover", "blocks": [{"t": "p", "x": "비슷한 소리의 다른 말로 받는다."}, {"t": "key", "l": "써먹기", "x": "회의에서 낯선 외래어나 줄임말이 나오면 비슷한 소리의 아는 말로 일부러 잘못 알아듣고, 두 번째에는 말이 되는 쪽으로 착지합니다."}, {"t": "lk", "x": "이 기술 설명은 본편 2장 「소리로 받기」에", "url": "note.html#c2"}]}, {"type": "scene", "sid": "e04", "sec": "본편 2장 · 쇼츠TOP5", "title": "에스파", "blocks": [{"t": "p", "x": "에이핑크 멤버가 나온 자리에서 걸그룹 이름이 줄줄이 나오다가, 탁재훈 본인의 프로젝트 그룹 이야기로 넘어갑니다."}, {"t": "v", "src": "영상/04_%EC%87%BC%EC%B8%A0TOP5_24.mp4", "poster": "img/132d8e575202.jpg", "stop": 19.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "근데 에스파에 들어가면 제가 당하지 않을까요?"}, {"w": "", "x": "아 괜찮아요."}]}, {"t": "h3", "x": "탁재훈의 답 — 스파"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "저는 그냥 스파에 들어가선 반신욕 하는 게 낫죠."}, {"w": "", "x": "너도 뭐 하나 런치해봐"}, {"w": "", "x": "런지?"}, {"w": "", "x": "뭘 런칭할까"}, {"w": "", "x": "렌즈나"}, {"w": "", "x": "어 렌즈 좋다"}]}, {"t": "p", "x": "'에스파에 들어간다'는 그룹에 합류한다는 뜻인데, 앞 글자 하나를 떼면 '스파에 들어간다', 곧 목욕이 됩니다. 여기서 끝나지 않고 그 새 장면을 사실처럼 이어 갑니다. 반신욕을 하는 사람이 되어 \"어때요 제 상체?\"까지 갑니다. 단어를 바꾸는 것이 1단, 바꾼 장면 안에서 한 번 더 노는 것이 2단입니다. 같은 쇼츠의 마지막 장면은 소리 사슬입니다. 게스트가 자기 브랜드를 1년 준비해 출시했다는 얘기 끝에 누가 탁재훈에게도 하나 해 보라고 합니다. '런칭'을 운동 '런지'로 한 번 비틀고, 다시 '렌즈'로 소리를 이어 실제로 출시할 법한 물건에 착지합니다. 소리 놀이가 마지막엔 말이 되는 상품이 되니 상대도 \"렌즈 좋다\"고 받아 줍니다. 소리 비틀기는 엉뚱한 데서 끝나면 썰렁하고, 말이 되는 데서 끝나면 박수를 받습니다."}, {"t": "lk", "x": "본편 2장 「소리로 받기」에서 이 장면 설명 보기", "url": "note.html#c2"}], "cut": 3}, {"type": "scene", "sid": "e05", "sec": "본편 2장 · 노빠꾸45분", "title": "배울 점이 있는 사람", "blocks": [{"t": "p", "x": "소리 비틀기가 가장 세게 터지는 때는 상대가 앞에서 한 말과 지금 한 말이 겹칠 때입니다. 노빠꾸탁재훈에서 게스트가 이상형을 '배울 점이 있고 존경할 수 있는 사람'이라고 모범답안을 냅니다. 탁재훈은 먼저 \"이거 내가 30년 전에 다 썼던 멘트를 그대로 쓰네.\"로 의심을 깔아 두고, 구체적으로 어떤 스타일이냐고 다시 묻습니다."}, {"t": "v", "src": "영상/05_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_408.mp4", "poster": "img/b59b3ab0bd9b.jpg", "stop": 22.7}, {"t": "dq", "ans": false, "lines": [{"w": "게스트", "x": "배우분으로 따지자면"}]}, {"t": "h3", "x": "탁재훈의 답 — 배우를 좋아하네"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "배우를 좋아하네!"}]}, {"t": "p", "x": "'배울 점'과 '배우'가 소리로 겹치는 순간을 놓치지 않았습니다. 앞에서 의심을 깔아 둔 덕에, 이 한마디가 모범답안이 거짓이었다는 증거처럼 들립니다. 혼자서는 그냥 말장난인데, 앞뒤 말을 이어 붙이니 논리가 됩니다."}, {"t": "lk", "x": "본편 2장 「소리로 받기」에서 이 장면 설명 보기", "url": "note.html#c2"}], "cut": 3}, {"type": "scene", "sec": "신발 벗고 돌싱포맨 (SBS) 탁재훈 모음 (SBSNOW 클립, 여러 회차) · 게스트(유튜버), 멤버", "title": "예상 못 한 질문을 받았을 때", "blocks": [{"t": "p", "x": "게스트가 탁재훈이 이상형이라고 말해 온 사이라, 멤버들이 탁재훈에게 '애기야' 하고 다정하게 불러 보라고 시킨다(02:51~02:56). 탁재훈은 로맨틱한 대화를 못 한다고 빼고, 멤버가 '형 스타일 있잖아'라며 평소 말투를 보여 달라고 한다. 모두가 기대한 건 달콤한 대사 한 줄이다."}, {"t": "v", "src": "영상/y_3g6g9MUyYZ4_1.mp4", "poster": "img/y_3g6g9MUyYZ4_1.jpg", "stop": 19.7}, {"t": "dq", "ans": false, "lines": [{"w": "탁재훈", "x": "저는 이렇게 이게 로맨틱하게 대화를 잘 못 해 가지고"}, {"w": "멤버", "x": "형 스타일 있잖아"}]}, {"t": "h3", "x": "탁재훈의 답 — 우리 연초에 어디 갈까 — 연초나 끊어"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "내 스타일은 뭐 아 우리 연초에 어디 갈까 연초나 끊어"}, {"w": "게스트", "x": "너무 매력 있어"}]}, {"t": "p", "x": "평범하게는 어색하게 '애기야~'를 해 주거나 끝까지 거절한다. 탁재훈은 요구는 들어주는 척하면서 '내 스타일'이라는 핑계로 무뚝뚝한 남자 캐릭터를 보여 줬고, 그 무뚝뚝함이 동음이의어 말장난으로 포장돼 있어 무례하게 들리지 않는다."}, {"t": "ul 빠꾸탁재훈 시즌4 EP.54 · 신규진, 김예원", "title": "여러 사람이 동시에 대화할 때", "blocks": [{"t": "p", "x": "길에서 알아보는 사람이 있냐는 이야기. 진행자가 '뭐 이렇게 전화'(18:30, 자막 끊김)라며 연락처를 묻는 상황을 꺼내자 김예원이 '아 아니 그런 거는 / 싫어요'로 짧게 거절한다. 김예원에게는 오래된 화제 장면이 있고, 그 장면 속 말은 이 회차에서 '추워요' 톤, 겨울이면 '서로서로에게 물어볼' 말(18:53)로만 언급된다."}, {"t": "v", "src": "영상/y_3V77rNVtqB4_5.mp4", "poster": "img/y_3V77rNVtqB4_5.jpg", "stop": 4.7}, {"t": "dq", "ans": false, "lines": [{"w": "김예원", "x": "싫어요."}]}, {"t": "h3", "x": "탁재훈의 답 — '추워요' 톤이랑 똑같아서"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "너 지금 일부러 그렇게 한 거지?"}, {"w": "탁재훈", "x": "지금 '추워요' 톤이랑 똑같아서 그런 거잖아."}, {"w": "김예원", "x": "그게 아니라니까."}, {"w": "진행자", "x": "당신의 계절이 왔다고."}, {"w": "김예원", "x": "근데 저 진짜 그 말에 되게 움찔움찔하긴 해요."}]}, {"t": "p", "x": "보통은 거절의 내용(연락처는 안 준다)에 반응한다. 여기서는 내용 대신 억양을 듣고, 그것도 '일부러 한 거지?'로 의도를 단정한다. 상대는 억양을 고칠 수도 없고, 부정할수록 같은 톤이 다시 나온다(18:44 '싫어요. 이거요')."}, {"t": "ul", "items": ["단어가 아니라 억양도 재료가 된다 — 지금 한 말이 옛날 그 말과 '같은 소리'인지 듣는다", "의도를 먼저 묻고('일부러 한 거지?') 근거를 나중에 대면 두 번 웃긴다", "오래된 콜백은 상대의 반응(움찔한다)을 보며 한 번만 쓴다"]}, {"t": "note", "x": "써도 될 때 — 상대의 유명한 말투·말버릇을 둘 다 알고 상대가 그걸 웃으며 다룰 수 있는 사이. 상대가 무심코 같은 톤을 냈을 때 딱 한 번."}, {"t": "note", "x": "피할 때 — 상대가 '그 말에 움찔한다'(18:56)고 한 것처럼, 당사자에게는 여전히 불편할 수 있는 재료다. 상대가 정색하면 바로 멈춘다. 처음 보는 사람의 말투를 흉내 내거나 지적하는 것은 무례하다."}, {"t": "src", "x": "노빠꾸탁재훈 시즌4 EP.54 · 18:33 · 대사는 유튜브 자막·Whisper 대조 · 화자 추정", "url": "https://www.youtube.com/watch?v=3V77rNVtqB4&t=1111s"}], "cut": 3}]}, {"no": "②", "title": "문자 그대로 받기", "sub": "비유나 관용 표현을 말 그대로의 사실로 받는다.", "meta": "장면 14개", "tags": ["상대가 너무 진지할 때", "놀림받았을 때", "상대가 불편해할 때"], "cards": [{"type": "cover", "blocks": [{"t": "p", "x": "비유나 관용 표현을 말 그대로의 사실로 받는다."}, {"t": "lk", "x": "이 기술 설명은 본편 2장 「소리로 받기」에", "url": "note.html#c2"}]}, {"type": "scene", "sid": "e03", "sec": "본편 1장 · 분석좌", "title": "김부각은 언제 먹어요", "blocks": [{"t": "p", "x": "분석좌가 가장 강조하는 건 순서입니다. 보통 사람은 뭐라고 받아칠지부터 찾는데, 탁재훈은 의외로 상대의 말을 충분히 듣고 그걸 재료로 씁니다. 화사가 김부각을 좋아한다는 이야기가 나온 장면이 대표적입니다."}, {"t": "v", "src": "영상/03_%EB%B6%84%EC%84%9D%EC%A2%8C_462.mp4", "poster": "img/4836876df85e.jpg", "stop": 6.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "김부각을 어느 때 먹어요 그럼?"}, {"w": "", "x": "진짜 배고플 때 밥이랑 김부각만 먹어도 끝나요"}]}, {"t": "h3", "x": "탁재훈의 답 — 손에 있는 꼬깔콘은 언제 먹어요"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "지금 그럼 손에 있는 꼬깔콘은 언제 먹어요?"}]}, {"t": "p", "x": "해설에 따르면 탁재훈은 화사의 길고 뾰족한 손톱을 이미 보고 있었습니다. 그런데 바로 손톱 얘기를 하지 않았습니다. 먼저 상대 이야기(먹는 얘기)에 맞춘 질문을 하나 던져 레일을 깔고, 상대가 대답한 다음에 그 레일을 틀었습니다. 같은 말이라도 처음부터 손톱을 놀렸다면 그냥 외모 지적이었을 겁니다. 먹는 이야기 위에 얹었기 때문에 손톱이 과자가 됐습니다. 분석좌의 결론은 이 한 문장입니다. \"즉 위트의 시작은 신박한 드립이 아니라 경청을 통해 먼저 깔려있는 전제를 파악하는 것이죠.\""}, {"t": "lk", "x": "본편 1장 「위트는 기술이다」에서 이 장면 설명 보기", "url": "note.html#c1"}], "cut": 3}, {"type": "scene", "sid": "e06", "sec": "본편 2장 · 분석좌", "title": "이 장면에서", "blocks": [{"t": "p", "x": "두 번째 갈래는 소리를 바꾸지 않고 뜻을 바꿉니다. 상대는 비유로 말했는데 그 비유를 사실로 받는 것입니다. 분석좌는 이걸 '의미 바꾸기'라 부르고 이렇게 요약합니다. 상대가 말하는 의도 말고 들리는 그대로 받는다. 그가 든 예 중 하나가 토크를 몇 개 가져왔냐는 질문입니다."}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "한 몇 개 정도 가지고 오셨습니까?"}]}, {"t": "h3", "x": "탁재훈의 답 — 기술 ② 문자 그대로 받기"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "아 뭐 한 지금 세 네 개 갖고 왔는데 모자르면 또 차 트렁크에 있습니다."}]}, {"t": "lk", "x": "본편 2장 「소리로 받기」에서 이 장면 설명 보기", "url": "note.html#c2"}], "cut": 2}, {"type": "scene", "sid": "e07", "sec": "본편 2장 · 노빠꾸45분", "title": "까치둥지라고 불렸어요", "blocks": [{"t": "p", "x": "노빠꾸탁재훈에는 이 기술의 교과서 같은 장면이 있습니다. 게스트가 머리 상태 때문에 별명이 까치둥지였다고 말합니다."}, {"t": "v", "src": "영상/06_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_1578.mp4", "poster": "img/c58410e261d2.jpg", "stop": 6.7}, {"t": "dq", "ans": false, "lines": [{"w": "게스트", "x": "그래서 저보고 맨날 까치둥지 같은 거 해서 맨들 까치둥지라고 불렀어요."}]}, {"t": "h3", "x": "탁재훈의 답 — 여기 새가 앉은 적이 있어요?"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "아 여기 새가 앉은 적이 있어요?"}]}, {"t": "p", "x": "별명이라는 비유를 사실로 받아서, 그 둥지에 진짜 새가 앉았냐고 묻습니다. 상대 말 속 단어 하나만 쓰기 때문에 듣는 사람이 따로 생각할 필요가 없습니다. 짧고, 바로 그림이 그려지고, 상대를 깎지도 않습니다."}, {"t": "lk", "x": "본편 2장 「소리로 받기」에서 이 장면 설명 보기", "url": "note.html#c2"}], "cu 곧 돌아올 때를 상상했습니다. 분석좌는 이렇게 짚습니다. \"탁재훈은 그 비어있는 반대편을 상상해서 농담을 만든 겁니다\" 1장의 배당 장면도 같은 구조입니다. 무엇을 할지(내기)는 정해졌는데 어떻게 할지(배당)가 빠져 있었고, 탁재훈은 그 빈칸을 물었습니다. 빈칸을 다루는 방법은 크게 둘입니다. 내가 채워서 단정하는 것, 그리고 상대에게 채우라고 되묻는 것."}, {"t": "lk", "x": "본편 3장 「빈칸 채우기」에서 이 장면 설명 보기", "url": "note.html#c3"}], "cut": 3}, {"type": "scene", "sid": "e12", "sec": "본편 3장 · 쇼츠TOP5", "title": "이 장면에서", "blocks": [{"t": "p", "x": "지침의 대표 예시가 이 장면입니다. 중국어를 하는 게스트와 얘기하는데 누군가 자기도 중국어를 좀 한다고 끼어듭니다."}, {"t": "v", "src": "영상/11_%EC%87%BC%EC%B8%A0TOP5_1.mp4", "poster": "img/6fec63e506f0.jpg", "stop": 2.7}, {"t": "dq", "ans": false, "lines": [{"w": "출연자", "x": "저도 사실 중국어를 조금 할 줄 알거든요"}]}, {"t": "h3", "x": "탁재훈의 답 — 중국집에 있었어요? 주방이야 홀이야 / 딜러 때인가요? 어느 매장?"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "아 중국집에 있었어요?"}, {"w": "탁재훈", "x": "주방?"}, {"w": "탁재훈", "x": "주방이야 홀이야"}, {"w": "탁재훈", "x": "느낌이 아예 다른데?"}, {"w": "탁재훈", "x": "이거는 뭐 딜러 때인가요?"}, {"w": "탁재훈", "x": "자동차 딜러들 어디 계셨어요?"}, {"w": "탁재훈", "x": "어느 매장에 계신 거예요?"}]}, {"t": "p", "x": "중국어를 할 줄 안다는 말에서 빠진 빈칸은 '어디서 배웠나'입니다. 탁재훈은 그 빈칸을 가장 생활감 있는 장소, 중국집으로 채웠습니다. 그리고 거기서 멈추지 않고 \"주방이야 홀이야\"로 한 번 더 구체적으로 물어서 단정을 굳힙니다. 같은 쇼츠에 같은 공식이 하나 더 있습니다. 누군가의 옛날 모습을 보며 다들 느낌이 다르다고 하자 이렇게 받습니다. 쇼츠 분석에서 정리한 공식은 '단정 + 세부 질문'입니다. 단정만 하면 그냥 놀림인데, 세부 질문을 하나 더 붙이면 상대가 그 설정 안에서 대답해야 하는 처지가 됩니다. 듣는 사람은 그 순간 머릿속에 중국집 주방과 자동차 매장을 그리게 됩니다."}, {"t": "lk", "x": "본편 3장 「빈칸 채우기」에서 이 장면 설명 보기", "url": "note.html#c3"}], "cut": 3}, {"type": "scene", "sid": "e13", "sec": "본편 3장 · 쇼츠탁치고", "title": "냅킨이 나왔다", "blocks": [{"t": "p", "x": "술자리 쇼츠에서는 물건 하나로 신분을 단정합니다. 냅킨을 달라고 했더니 상대가 뜻밖의 곳에서 냅킨을 꺼냅니다."}, {"t": "v", "src": "영상/12_%EC%87%BC%EC%B8%A0%ED%83%81%EC%B9%98%EA%B3%A0_14.mp4", "poster": "img/c907472e02ee.jpg", "stop": 14.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "갖고 다니니?"}, {"w": "", "x": "어떻게 여기서 나오냐?"}]}, {"t": "h3", "x": "탁재훈의 답 — 좀 이따 만국기 한 번 꺼내봐"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "좀 이따 만국기 한 번 꺼내봐."}, {"w": "", "x": "여기 있음."}]}, {"t": "p", "x": "물건이 엉뚱한 겨 두면 상대가 더 큰 웃음을 만들어 온다", "상대가 상황극을 시작하면 상대역으로 내려가 받쳐 준다"]}, {"t": "note", "x": "써도 될 때 — 상대가 스스로 웃길 줄 아는 사람이라 반발을 재료로 쓸 수 있을 때, 외모 이야기를 상대도 개그 소재로 써 온 관계."}, {"t": "note", "x": "피할 때 — 외모에 예민한 상대, 처음 보는 사람, 업무 자리. 말하지 않는 놀림도 놀림이다."}, {"t": "src", "x": "노빠꾸탁재훈 시즌4 EP.37 · 05:04 · 대사는 유튜브 자막·Whisper 대조 · 화자 추정", "url": "https://www.youtube.com/watch?v=iUvXyK05VDs&t=301s"}]}]}, {"no": "④", "title": "되물어 공 넘기기", "sub": "바로 답하지 않고 가장 구체적인 부분을 되물어 주도권을 가져온다.", "meta": "장면 5개", "tags": ["불리한 질문을 받았을 때"], "cards": [{"type": "cover", "blocks": [{"t": "p", "x": "바로 답하지 않고 가장 구체적인 부분을 되물어 주도권을 가져온다."}, {"t": "key", "l": "써먹기", "x": "상대가 은근한 말을 던지거나 나를 몰아붙이면 바로 대답하지 말고 그 말에서 가장 구체적인 부분을 되묻습니다."}, {"t": "lk", "x": "이 기술 설명은 본편 1장 「위트는 기술이다」에", "url": "note.html#c1"}]}, {"type": "scene", "sid": "e01", "sec": "본편 1장 · 분석좌", "title": "분석좌가 소개한 시청률 내기 함정과 탁재훈의 한마디", "blocks": [{"t": "p", "x": "탁재훈의 대답은 한 줄이었습니다."}, {"t": "v", "src": "영상/01_%EB%B6%84%EC%84%9D%EC%A2%8C_0.mp4", "poster": "img/8385c5bee8ee.jpg"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "배당이 어떻게 되는데?"}]}, {"t": "p", "x": "분석좌의 해설은 이렇습니다. 보통 사람은 도박꾼이 되지 않으려고 애쓰는데, 탁재훈은 도박꾼이라는 설정을 피하지 않고 오히려 더 깊이 들어갔습니다. 그리고 원래는 질문받던 사람이 질문하는 사람이 됐습니다. \"딱 한마디로 주도권을 역전해버린 거죠\""}, {"t": "lk", "x": "본편 1장 「위트는 기술이다」에서 이 장면 설명 보기", "url": "note.html#c1"}]}, {"type": "scene", "sid": "e02", "sec": "본편 1장 · 아형복귀", "title": "시청률 5% 질문", "blocks": [{"t": "p", "x": "같은 장면을 원래 방송 쪽 대화록으로 다시 보면 흐름이 더 잘 보입니다. 아는 형님에 전학생으로 들어온 날, 멤버가 \"우리 학교\" 시청률이 5%를 넘겠냐고 묻습니다."}, {"t": "v", "src": "영상/02_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_113.mp4", "poster": "img/c36e03ff241c.jpg", "stop": 15.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "어? 그럼 우리 학교 앞으로 시청률 이제 5% 넘나 안 넘나요?"}, {"w": "탁재훈", "x": "넘는다에 걸 거야, 안 넘는 다에 걸까요?"}]}, {"t": "h3", "x": "탁재훈의 답 — 배당이 어떻게 되는데"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "배당 어떻게 되는데?"}, {"w": "", "x": "안돼!"}, {"w": "", "x": "난 주로 역배 까는 사람이야."}]}, {"t": "p", "x": "예측 질문을 내기판으로 바꾸고, 배당과 역배라는 도박판 말을 자기가 먼저 꺼냅니다. 멤버들의 \"안돼!\"는 선 근처까지 왔다는 신호입니다. 그런데도 판이 깨지지 않는 이유는, 남이 꺼내기 전에 본인이 먼저 꺼냈기 때문입니다. 마지막 \"역배\"는 시청률이 안 넘는다는 쪽에 건다는 뜻이라, 은근히 프로그램을 놀리는 말이기도 합니다."}, {"t": "lk", "x": "본편 1장 「위트는 기술이다」에서 이 장면 설명 보기", "url": "note.html#c1"}], "cut": 3}, {"type": "scene", "sid": "e15", "sec": "본편 3장 · 파트너모음", "title": "표절에 민감하다", "blocks": [{"t": "p", "x": "빈칸을 내가 채우지 않고 상대에게 채우라고 돌려줄 수도 있습니다. 배당 장면이 그랬습니다. 대답해야 할 사람이 질문을 던지면 이번엔 상대가 설명해야 합니다. 분석좌의 표현대로 주도권이 넘어옵니다. 짧은 클립 모음에서 이 기술이 선명하게 보이는 장면은 게스트가 먼저 '표절'이라는 말을 꺼낸 순간입니다."}, {"t": "v", "src": "영상/13_%ED%8C%8C%ED%8A%B8%EB%84%88%EB%AA%A8%EC%9D%8C_64.mp4", "poster": "img/8652cc33ef2f.jpg", "stop": 3.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "저 요즘 표절 굉장히 민감하거든요?"}]}, {"t": "h3", "x": "탁재훈의 답 — 표절이에요?"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "아 표절이에요?"}, {"w": "", "x": "아니 아니에요."}, {"w": "", "x": "표절이예요?"}, {"w": "", "x": "아니에요!"}, {"w": "", "x": "일본 곡인가요?"}, {"w": "", "x": "표절도 미리 얘기하면 조금 낫지 않을까요?"}, {"w": "", "x": "내가 그냥 머리가 아파서 살짝 베꼈습니다."}]}, {"t": "p", "x": "'민감하다'는 말을 '찔리는 게 있다'로 듣고 계속 되묻습니다. 부정할수록 질문이 구체적으로 바뀌고(일본 곡인가요?), 마지막에는 '자수하면 낫다'는 틀까지 씌웁니다. 결국 게스트가 상황극으로 자백해 버립니다. 탁재훈은 단정한 적이 없습니다. 묻기만 했습니다."}, {"t": "lk", "x": "본편 3장 「빈칸 채우기」에서 이 장면 설명 보기", "url": "note.html#c3"}], "cut": 3}, {"type": "scene", "sid": "e16", "sec": "본편 3장 · 미우새2022", "title": "천억 질문: 나를 살리겠어, 죽이겠어?", "blocks": [{"t": "p", "x": "곤란한 양자택일에도 되묻기가 통합니다. 미운 우리 새끼에서 한 멤버가 탁재훈에게 이런 질문을 냅니다. 자기가 죽어야 천억이 생긴다면 자기를 살리겠냐 죽이겠냐는 것입니다."}, {"t": "v", "src": "영상/14_%EB%AF%B8%EC%9A%B0%EC%83%882022_667.mp4", "poster": "img/1a8f9cebe930.jpg", "stop": 10.7}, {"t": "dq", "ans": false, "lines": [{"w": "멤버", "x": "그러면 나를 살리겠어, 죽이겠어?"}]}, {"t": "h3", "x": "탁재훈의 답 — 더 살고 싶어?"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "더 살고 싶어?"}, {"w": "탁재훈", "x": "가서 또 한 번 할 거야. 확인을 할 거야, 정말 진짜 죽었나."}, {"w": "탁재훈", "x": "너 살아 있어봐야 또 빚이야."}]}, {"t": "p", "x": "질문한 사람은 '당연히 살리지'라는 모범답안을 기대했습니다. 탁재훈은 고르지 않고 \"더 살고 싶어?\"로 질문을 되돌린 뒤, 한술 더 떠 기대와 정반대 쪽으로 갑니다. 친한 사이여서 성립하는 수위입니다."}, {"t": "lk", "x": "본편 3장 「빈칸 채우기」에서 이 장면 설명 보기", "url": "note.html#c3"}], "cut": 3}, {"type": "scene", "sec": "노빠꾸탁재훈 시즌4 EP.53 · 장서희", "title": "불리한 질문을 받았을 때", "blocks": [{"t": "p", "x": "장서희가 탁재훈에 대한 소문으로 '어린 녀석이랑'을 꺼내 한 번 찌른 뒤, 사실 예전에 필리핀 가족 여행 가는 비행기 안에서 탁재훈을 본 적이 있다며 '그때 되게 단란하셨어요'라고 말한다. 탁재훈의 지나간 가족사를 건드릴 수 있는 말이라, 해명하거나 표정이 굳기 쉬운 지점."}, {"t": "v", "src": "영상/y_5TwXUxbFsI4_3.mp4", "poster": "img/y_5TwXUxbFsI4_3.jpg", "stop": 13.7}, {"t": "dq", "ans": false, "lines": [{"w": "장서희", "x": "그때 그때 되게 단란하셨어요."}, {"w": "탁재훈", "x": "그러니까 기억이 안 나는데 아는 척 했어요?"}, {"w": "장서희", "x": "아는 척 못 했죠. 왜냐면 굉장히 단란하게 가셔서 저도 남자친구랑 갔죠."}]}, {"t": "h3", "x": "탁재훈의 답 — '단란하셨어요' → '그 남자랑 헤어졌어요?'"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "그 남자랑 헤어졌어요?"}, {"w": "장서희", "x": "아 진작에 헤어졌죠."}, {"w": "탁재훈", "x": "아 그게 무슨 진짜 오래된 건데 20년?"}]}, {"t": "p", "x": "보통은 '아 그때요…' 하며 사정을 설명하거나 표정이 굳는다. 어느 쪽이든 자기 아픈 데를 스스로 더 드러내게 된다. 탁재훈은 자기 얘기는 한마디도 하지 않고, 상대 문장 끝의 '남자친구'를 집어 '헤어졌어요?'로 물었다. 서로의 지난 관계라는 같은 처지로 만들어 균형을 맞췄다."}, {"t": "ul", "items": ["내 아픈 데를 건드리는 말에는 해명하지 말고, 상대 문장 속 상대 자신의 정보를 찾아 같은 질문으로 돌려준다", "첫 반응은 시간 벌기, 두 번째에 공 넘기기"]}, {"t": "note", "x": "써도 될 때 — 상대가 내 사적인 과거를 건드리면서 자기 정보도 함께 흘렸을 때."}, {"t": "note", "x": "피할 때 — 상대의 과거 관계가 실제 상처(사별·이혼 직후 등)일 수 있을 때 — 되묻기가 보복처럼 들린다. 상대가 흘리지 않은 정보를 억지로 캐는 것은 무례."}, {"t": "src", "x": "노빠꾸탁재훈 시즌4 EP.53 · 12:36 · 대사는 유튜브 자막·Whisper 대조 · 화자 추정", "url": "https://www.youtube.com/watch?v=5TwXUxbFsI4&t=745s"}], "cut": 3}]}, {"no": "⑤", "title": "설정 올라타기", "sub": "상대 말을 사실로 받아 그 설정의 언어로 말한다. 설정을 직접 만들 수도 있다.", "meta": "장면 8개", "tags": ["상대가 너무 진지할 때", "여러 사람이 동시에 대화할 때", "분위기가 굳었을 때"], "cards": [{"type": "cover", "blocks": [{"t": "p", "x": "상대 말을 사실로 받아 그 설정의 언어로 말한다. 설정을 직접 만들 수도 있다."}, {"t": "key", "l": "써먹기", "x": "회의나 모임에 이미 정해진 콘셉트가 있으면 사소한 일도 그 콘셉트의 용어로 말합니다."}, {"t": "lk", "x": "이 기술 설명은 본편 4장 「판 위에 올라타기」에", "url": "note.html#c4"}]}, {"type": "scene", "sid": "e17", "sec": "본편 4장 · 노빠꾸45분", "title": "술 잘 되세요?", "blocks": [{"t": "p", "x": "노빠꾸탁재훈은 탁재훈이 '반장', 신규진이 '형사'로 앉아 게스트를 조사하는 경찰서 설정입니다. 탁재훈은 사적인 얘기를 거의 매번 이 설정의 언어로 받습니다. 게스트가 술이 세다는 얘기 끝에 프로필을 읽다가 곧 생일이라고 덧붙입니다."}, {"t": "v", "src": "영상/15_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_1449.mp4", "poster": "img/1b1caf43a78c.jpg", "stop": 6.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "술 잘 되세요?"}]}, {"t": "h3", "x": "탁재훈의 답 — 저 오늘 약속 있습니다 / 곧 생일이에요"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "저 오늘 약속 있습니다."}, {"w": "", "x": "곧 생일이에요."}, {"w": "", "x": "왜 여기서 얘기를 해요? 생일인 거는."}, {"w": "", "x": "여기는 저 생일 파티하는 데가 아니에요."}, {"w": "", "x": "경찰서에요, 경찰서."}]}, {"t": "p", "x": "축하하는 게 당연한 순간을 조사실 설정으로 차갑게 자르니 기대가 뒤집힙니다. 앞의 \"저 오늘 약속 있습니다\"도 같은 원리입니다. 아무도 술 마시러 가자고 하지 않았는데 먼저 핑계를 대고 피해서, 상대가 얼마나 술이 센지를 거꾸로 보여 줍니다. 같은 회차에서 노트를 보여 주기 싫다는 게스트에게 \"증거 자료로 제출하시겠어요?\"라고 한 것도 설정 올라타기입니다."}, {"t": "lk", "x": "본편 4장 「판 위에 올라타기」에서 이 장면 설명 보기", "url": "note.html#c4"}], "cut": 3}, {"type": "scene", "sid": "e18", "sec": "본편 4장 · 아형복귀", "title": "예전 행복으로 돌아가고 싶지 않아?", "blocks": [{"t": "p", "x": "설정은 내가 만들 수도 있습니다. 자숙 복귀 회차에서 멤버가 예전의 행복으로 돌아가고 싶지 않냐고 묻습니다. 감성적인 질문입니다."}, {"t": "v", "src": "영상/16_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_676.mp4", "poster": "img/548d1123906e.jpg", "stop": 13.7}, {"t": "dq", "ans": false, "lines": [{"w": "멤버", "x": "다시 돌아가고 싶진 않아?"}, {"w": "탁재훈", "x": "어디를?"}, {"w": "멤버", "x": "전의 행복으로."}, {"w": "탁재훈", "x": "아니, 돌아가기 쉽지는 않아."}, {"w": "탁재훈", "x": "잘못 돌아가서 2년 전으로 돌아가면 안 돼."}, {"w": "탁재훈", "x": "타임머신 보면 가끔가다 잘못 내리잖아."}]}, {"t": "h3", "x": "탁재훈의 답 — 타임머신 잘못 내려서 서초동"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "그냥 잘못 내려서 서초동에 내리면 안 돼?"}]}, {"t": "p", "x": "'돌아간다'를 타임머신으로 받고, 도착지를 잘못 내리는 사고를 상상해 사건 무렵의 법원 동네를 떠올리게 합니다. 아픈 과거를 본인이 먼저, 그것도 공상과학 설정으로 꺼내 버리니 다른 사람이 더 찌를 틈이 없습니다. 이 장면은 6장의 '먼저 꺼내기'와도 이어집니다."}, {"t": "lk", "x": "본편 4장 「판 위에 올라타기」에서 이 장면 설명 보기", "url": "note.html#c4"}], "cut": 3}, {"type": "scene", "sec": "노빠꾸탁재훈 시즌4 EP.49 · 정보윤, 신규진", "title": "여러 사람이 동시에 대화할 때", "blocks": [{"t": "p", "x": "신규진이 '그때 러브라인 있지 않으셨어요?'라고 묻자 진행진이 '질투했어?'라며 판을 키우고, 정보윤은 신규진이 누군지도 몇 살인지도 모른다며 '40대는 됐을 거 아니요?'라고 해 신규진이 크게 당한다. '최악', '긁혔다 긁혔어'라는 말과 함께 웃음이 터진 직후."}, {"t": "v", "src": "영상/y__pDsHMbnW4Y_4.mp4", "poster": "img/y__pDsHMbnW4Y_4.jpg", "stop": 29.7}, {"t": "dq", "ans": false, "lines": [{"w": "정보윤", "x": "40대는 됐을 거 아니요?"}]}, {"t": "h3", "x": "탁재훈의 답 — '나는 몇 살 같아요?' — 동료 대신 다음 타깃으로 나서기"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "나는 좀 몇 살 된 거 같아요?"}, {"w": "정보윤", "x": "아 근데 대충 아빠랑 비슷한 나이라고 들었는데"}, {"w": "정보윤", "x": "52."}, {"w": "탁재훈", "x": "아, 오늘 기분 좋네."}]}, {"t": "p", "x": "보통 진행자는 동료가 당하면 웃고 넘어가거나 게스트를 말린다. 탁재훈은 같은 질문을 자기에게 던지게 해 '이번엔 반장 차례'라는 기대를 만들었다. 게스트가 '아빠랑 비슷한 나이'라고까지 말해 더 센 공격이 예상됐는데, 정보윤이 52라고 후하게 답해 예상이 뒤집혔다."}, {"t": "ul", "items": ["동료가 당하면 같은 질문을 나에게 돌려 다음 타깃으로 나선다 — 동료는 빠지고 판은 이어진다", "결과가 좋으면 과장된 기쁨으로, 나쁘면 과장된 상처로 — 어느 쪽이든 반응을 크게"]}, {"t": "note", "x": "써도 될 때 — 동료가 집중 공격을 받아 웃음이 정점일 때, 내가 놀림을 받아 줄 여유가 있을 때."}, {"t": "note", "x": "피할 때 — 내가 그 자리의 상급자라 상대가 솔직하게 답하기 어려울 때(답이 아부가 되어 웃음이 사라진다), 상대가 이미 지친 상태일 때."}, {"t": "src", "x": "노빠꾸탁재훈 시즌4 EP.49 · 17:23 · 대사는 유튜브 자막·Whisper 대조 · 화자 추정", "url": "https://www.youtube.com/watch?v=_pDsHMbnW4Y&t=1016s"}], "cut": 3}, {"type": "scene", "sec": "노빠꾸탁재훈 시즌4 EP.54 · 신규진, 김예원", "title": "상대가 너무 진지할 때", "blocks": [{"t": "p", "x": "김예원이 출연 중인 드라마 「시고르 아모르」(05:27)의 배역을 설명하는 중. 서울에서 내려온 아이돌 연습생 출신 필라테스 강사로, 인기가 많다고 혼자 착각하는 역할이다. 진행자가 이를 '모든 남자들이 다 예원 씨를 좋아하는 병'으로 정리하자, 김예원은 연기하기 어려웠다는 배우다운 답을 하려던 참이었다."}, {"t": "v", "src": "영상/y_3V77rNVtqB4_1.mp4", "poster": "img/y_3V77rNVtqB4_1.jpg", "stop": 11.7}, {"t": "dq", "ans": false, "lines": [{"w": "김예원", "x": "인기가 많은 걸로 저 혼자 착각을 하는"}, {"w": "진행자", "x": "모든 남자들이 다 예원 씨를 좋아하는 병에 그런 병에 걸린 여자"}, {"w": "진행자", "x": "연기하기 쉬웠겠는데요."}, {"w": "탁재훈", "x": "그 병은 일찍감치 걸려 있었잖아."}]}, {"t": "h3", "x": "탁재훈의 답 — 그 병은 바닷가에서부터"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "그 병은 지금 바닷가에서부터 걸려 있었잖아요."}, {"w": "진행자", "x": "그래 갖고 이거 진단을 내렸잖아. 이거 못 고친다고."}]}, {"t": "p", "x": "보통은 '어떤 점이 이」에서 이 장면 설명 보기", "url": "note.html#c7"}]}, {"type": "scene", "sid": "e35", "sec": "본편 7장 · 노빠꾸45분", "title": "너무 다크하죠?", "blocks": [{"t": "p", "x": "노빠꾸탁재훈에서는 놀린 뒤 상대가 진짜 기죽었을 때 내려오는 장면이 있습니다. 게스트가 자기 분위기가 너무 어둡지 않냐고 걱정합니다."}, {"t": "v", "src": "영상/33_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_871.mp4", "poster": "img/1a26ec8bffc5.jpg", "stop": 10.7}, {"t": "dq", "ans": false, "lines": [{"w": "게스트", "x": "근데 저 지금 너무 다크하죠"}, {"w": "탁재훈", "x": "계속하세요 그렇게 조회수 안 나오려면"}]}, {"t": "h3", "x": "탁재훈의 답 — 꼴찌일 거 같은데"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "내가 보기엔 지금까지 꼴찌일 거 같은데"}, {"w": "게스트", "x": "꼴찌라는 말이 좀 슬프다"}, {"w": "탁재훈", "x": "시행착오라고 생각하셔도 돼요"}, {"w": "탁재훈", "x": "노빠꾸 대세는 지장이 없으니까 편하게 하세요."}]}, {"t": "p", "x": "걱정에 맞장구치는 척 '꼴찌'까지 세게 갔다가, 상대가 슬프다고 하자 바로 '시행착오'로 내려옵니다. 마지막 말은 위로이면서 '너 하나로 우리 채널 안 망한다'는 농담이기도 합니다. 위로 안에 장난을 하나 남겨 분위기를 유지한 것입니다. 줄을 당겼다가 상대가 아파하는 순간 바로 늦춘 셈입니다."}, {"t": "lk", "x": "본편 7장 「줄 길이」에서 이 장면 설명 보기", "url": "note.html#c7"}], "cut": 3}, {"type": "scene", "sid": "e36", "sec": "본편 7장 · 아형복귀", "title": "이뻐하는 거 알잖아", "blocks": [{"t": "p", "x": "줄을 길게 쥐면 결국 문다고 했습니다. 탁재훈도 넘습니다. 차이는 넘은 다음에 있습니다. 자숙 복귀 회차의 퀴즈 '내가 상민이한테 평소에 해 주고 싶었던 말'은 정답 자체가 선을 넘는 문장이었습니다. 탁재훈은 정답이 공개되기 직전에 관계부터 깔아 둡니다."}, {"t": "v", "src": "영상/34_%EC%95%84%ED%98%95%EB%B3%B5%EA%B7%80_1428.mp4", "poster": "img/da23021bde9c.jpg", "stop": 1.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "너 내가 이뻐하는 거 알잖아."}]}, {"t": "h3", "x": "탁재훈의 답 — 정답 공개"}, {"t": "dq", "ans": true, "lines": [{"w": "탁재훈", "x": "그러니까, 나도 욕 들어도 웃잖아."}, {"w": "", "x": "상민이 빚 다 갚는 날에 죽는다고."}, {"w": "", "x": "나빴다!"}, {"w": "", "x": "너무 막 몸이 망가지고 빚만 갚았으니까 걱정도 되고"}, {"w": "", "x": "그런 의미에서"}]}, {"t": "p", "x": "센 말 앞에는 애정 표현을, 뒤에는 '걱정돼서 한 말'이라는 포장을 붙였습니다. 넘었다가 돌아오는 구조가 뚜렷합니다. 상대가 \"나도 욕 들어도 웃잖아\"로 미리 받아 준 관계였기에 가능했다는 점도 같이 봐야 합니다."}, {"t": "lk", "x": "본편 7장 「줄 길이」에서 이 장면 설명 보기", "url": "note.html#c7"}], "cut": 3}, {"type": "scene", "sid": "e37", "sec": "본편 7장 · 아형모음", "title": "그래서 천국을 찾아 떠나신 거예요?", "blocks": [{"t": "p", "x": "반례도 공부 재료입니다. 첫째는 5장의 솔로지옥 장면 바로 뒤입니다. 솔로가 천국이라고 했던 탁재훈에게 상대가 그 틀을 그대로 돌려줍니다."}, {"t": "v", "src": "영상/35_%EC%95%84%ED%98%95%EB%AA%A8%EC%9D%8C_1587.mp4", "poster": "img/1a4b7ab68291.jpg", "stop": 21.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "그래서 천국을 찾아서 떠나신 거예요?"}, {"w": "탁재훈", "x": "내가 천국으로 찾아 떠난 건 아니고..."}]}, {"t": "h3", "x": "이렇게 됐다 (안 통한 장면) — 말문이 막힌 탁재훈"}, {"t": "dq", "ans": true, "lines": [{"w": "", "x": "나 말문 막힌 탁재훈 처음 봐."}, {"w": "", "x": "네가 뭘 알아, 인마!"}]}, {"t": "p", "x": "자기가 만든 비유(솔로는 천국)가 자기 이혼을 가리키게 되자 받을 말이 없습니다. 웃음은 오히려 '말문 막힌 탁재훈'이라는 희귀한 장면에서 나왔습니다. 막혔을 때 \"네가 뭘 알아\"처럼 짧게 끊은 것은 그나마 좋은 수습입니다. 길게 해명했다면 더 꼬였을 겁니다."}, {"t": "lk", "x": "본편 7장 「줄 길이」에서 이 장면 설명 보기", "url": "note.html#c7"}], "cut": 3}, {"type": "scene", "sid": "e38", "sec": "본편 7장 · 노빠꾸45분", "title": "판단이 늦으셨네", "blocks": [{"t": "p", "x": "둘째는 남의 아픈 데를 파고들다 같은 약점을 돌려받은 장면입니다. 결혼 뒤 방송을 쉬었던 게스트에게 탁재훈이 결혼을 '잘했는지 못했는지' 판단이 늦었다고 몰아갑니다."}, {"t": "v", "src": "영상/36_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_1255.mp4", "poster": "img/327d0334dcdc.jpg", "stop": 26.7}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "그걸 좀 빨리 판단을 하셨어야 되는데"}, {"w": "", "x": "아니요, 나름 되게 빠르게 판단한 것 같아요."}, {"w": "", "x": "아시지 않아요?"}]}, {"t": "h3", "x": "이렇게 됐다 (안 통한 장면) — 겪어보셨잖아요"}, {"t": "dq", "ans": true, "lines": [{"w": "", "x": "겪어보셨잖아요."}, {"w": "", "x": "제 생각이 그렇다는 것이 또 다른 사연이 있을 거 아니에요."}]}, {"t": "p", "x": "게스트가 '당신도 겪어 봤잖아'로 같은 약점을 돌려주자 탁재훈은 바로 맞받지 못하고 화제를 넘겼습니다. 6장에서 본 \"나는 여섯 번 했겠다\"와 나란히 놓으면 교훈이 선명합니다. 내가 먼저 꺼낸 약점은 무기가 되지만, 남이 꺼낸 약점은 방어하기 어렵습니다. 남의 아픈 곳을 팔 때는 그 삽이 나에게도 돌아올 수 있다는 걸 기억해야 합니다."}, {"t": "lk", "x": "본편 7장 「줄 길이」에서 이 장면 설명 보기", "url": "note.html#c7"}], "cut": 3}, {"type": "scene", "sec": "노빠꾸탁재훈 시즌4 EP.53 · 장서희", "title": "처음 만난 사람과 대화할 때", "blocks": [{"t": "p", "x": "장서희가 탁재훈이 젊은 게스트만 좋아해서 자기를 구박할까 봐 걱정했다고 털어놓는다. 탁재훈이 '그럼 어떻게 했으면 좋겠어요 제가?'라고 묻자 '그냥 가만히 있었으면', '아니면 웃겨 주세요'라고 받아친다. 긴장했느냐는 질문에 '조금요', 이유로 '말빨을 못 이기니까'라고 한다."}, {"t": "v", "src": "영상/y_5TwXUxbFsI4_2.mp4", "p x": "충분히 이해합니다"}]}, {"t": "h3", "x": "안 통한 장면 — 부하가 넘어갔다"}, {"t": "p", "x": "탁재훈이 이효리 외모를 칭찬하며 신규진에게 맞장구를 청했는데 신규진이 말이 없자 나무란다. 그러자 이효리가 신규진에게 '유튜브로 볼 땐 같이 맞장구치며 여자들 농락하더니 오늘은 순수하다'고 칭찬을 건넨다. 2대1로 게스트를 조사하던 구도에서 게스트가 부하를 자기 편으로 끌어가는 상황이다."}, {"t": "v", "src": "영상/y_DShCmQYzf74_2.mp4", "poster": "img/y_DShCmQYzf74_2.jpg"}, {"t": "dq", "ans": false, "lines": [{"w": "이효리", "x": "오빠를 받쳐준 사람이 몇 명 없는데 너무 잘 받쳐줘"}, {"w": "탁재훈", "x": "얘 3일 시작하고 난 다음에 자르라고 했어요"}]}, {"t": "key", "l": "차이", "x": "군대 이야기에서 '둘이 합친 것보다 제가 더 힘들었다'는 모두가 우열을 가리지 않는 모범 답안으로 정리하던 판에 자기 고생을 키워 끼어든 것이다. 아무도 깎이지 않으니 상대도 '충분히 이해합니다'로 웃으며 받았다. 이효리 편에서 신규진이 이효리 쪽으로 넘어가자 탁재훈은 후배를 깎아 2대1 구도를 되살리려 했다. 정면 부정과 '자르라고 했다'가 오히려 '받쳐 줄 사람 없는 오빠'라는 상대의 틀을 확인해 줬다. 신규진도 탁재훈 편에 서지 않았다."}], "cut": 8}, {"type": "pair", "sec": "", "title": "⑦ 틀 깨기 — 내가 깬 틀이 나에게 돌아올 때", "blocks": [{"t": "h3", "x": "통한 장면 — 솔로지옥? → 솔로가 얼마나 천국인데 → 결혼지옥"}, {"t": "p", "x": "대장님의 예처럼 질문의 전제를 문제 삼는 기술입니다. 연애 예능 「솔로지옥」 출연자들과 얘기하던 탁재훈이 프로그램 이름부터 걸고넘어집니다."}, {"t": "v", "src": "영상/21_%EC%95%84%ED%98%95%EB%AA%A8%EC%9D%8C_1550.mp4", "poster": "img/a4ae69716944.jpg"}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "왜 솔로가 지옥이야?"}, {"w": "탁재훈", "x": "솔로가 얼마나 천국인데."}, {"w": "", "x": "너네 둘이 이야기해 봐, 지금 결혼지옥을 겪고 있잖아."}]}, {"t": "h3", "x": "안 통한 장면 — 그래서 천국을 찾아 떠나신 거예요? → 말문이 막힌 탁재훈"}, {"t": "p", "x": "반례도 공부 재료입니다. 첫째는 5장의 솔로지옥 장면 바로 뒤입니다. 솔로가 천국이라고 했던 탁재훈에게 상대가 그 틀을 그대로 돌려줍니다."}, {"t": "v", "src": "영상/35_%EC%95%84%ED%98%95%EB%AA%A8%EC%9D%8C_1587.mp4", "poster": "img/1a4b7ab68291.jpg"}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "그래서 천국을 찾아서 떠나신 거예요?"}, {"w": "탁재훈", "x": "내가 천국으로 찾아 떠난 건 아니고..."}, {"w": "", "x": "나 말문 막힌 탁재훈 처음 봐."}]}, {"t": "key", "l": "차이", "x": "'솔로지옥'이라는 이름을 '솔로가 얼마나 천국인데'로 깬 것은 통했다. 바로 뒤에 상대가 같은 틀을 돌려줬다. '그래서 천국을 찾아 떠나신 거예요?'라는 말에 탁재훈의 말문이 막혔다. 내가 세운 주장(솔로=천국)은 상대가 그대로 써서 되돌릴 수 있는 재료가 된다."}], "cut": 8}, {"type": "pair", "sec": "", "title": "⑪ 온도 — 기죽은 상대에게 내려왔나, 아픈 데를 더 팠나", "blocks": [{"t": "h3", "x": "통한 장면 — 너무 다크하죠? → 꼴찌일 거 같은데 → 시행착오라고 생각하셔도 돼요"}, {"t": "p", "x": "노빠꾸탁재훈에서는 놀린 뒤 상대가 진짜 기죽었을 때 내려오는 장면이 있습니다. 게스트가 자기 분위기가 너무 어둡지 않냐고 걱정합니다."}, {"t": "v", "src": "영상/33_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_871.mp4", "poster": "img/1a26ec8bffc5.jpg"}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "근데 저 지금 너무 다크하죠"}, {"w": "탁재훈", "x": "계속하세요 그렇게 조회수 안 나오려면"}, {"w": "", "x": "내가 보기엔 지금까지 꼴찌일 거 같은데"}]}, {"t": "h3", "x": "안 통한 장면 — 판단이 늦으셨네 → 겪어보셨잖아요"}, {"t": "p", "x": "둘째는 남의 아픈 데를 파고들다 같은 약점을 돌려받은 장면입니다. 결혼 뒤 방송을 쉬었던 게스트에게 탁재훈이 결혼을 '잘했는지 못했는지' 판단이 늦었다고 몰아갑니다."}, {"t": "v", "src": "영상/36_%EB%85%B8%EB%B9%A0%EA%BE%B845%EB%B6%84_1255.mp4", "poster": "img/327d0334dcdc.jpg"}, {"t": "dq", "ans": false, "lines": [{"w": "", "x": "아시지 않아요?"}, {"w": "탁재훈", "x": "겪어보셨잖아요."}, {"w": "", "x": "제 생각이 그렇다는 것이 또 다른 사연이 있을 거 아니에요."}]}, {"t": "key", "l": "차이", "x": "'꼴찌라는 말이 좀 슬프다'는 신호가 오자 탁재훈은 '시행착오라고 생각하셔도 돼요'로 바로 내려왔다. 결혼 뒤 방송을 쉬었던 게스트에게 '판단이 늦었다'고 몰아간 장면에서는 같은 약점을 '겪어보셨잖아요'로 돌려받았다. 상대의 아픈 데를 파고들면, 내 약점이 같은 자리에 있을 때 그대로 돌아온다."}], "cut": 8}, {"type": "pair", "sec": "", "title": "⑩ 인정한 다음 — 한 칸 더 나갔나, 인정에서 멈췄나", "blocks": [{"t": "h3", "x": "통한 장면 — 뉴스에서도 메인을 뺏겼다"}, {"t": "p", "x": "탁재훈과 이수근이 나란히 서자 멤버들이 '도플갱어'라 부르고, '어디서 봤죠? 서초동에서'(08:17~08:21)라며 법원 동네를 꺼낸다. 멤버가 '이 투샷은 뉴스 아니면 보기 힘들다'고 하자 이수근이 '예전에 뉴스에 내가 메인으로 나왔다고 형이 서운해하더라'고 탁재훈을 놀린다."}, {"t": "v", "src": "영상/y_KPLVEyZwbho_2.mp4", "poster": "img/y_KPLVEyZwbho_2.jpg"}, {"t": "dq", "ans": false, "lines": [{"w": "탁재훈", "x": "아 그것도 밀리면 좀 그래."}, {"w": "탁재훈", "x": "어떻게 네가 나보다 메인이냐? 이거"}, {"w": "멤버", "x": "둘이 이제 영원히 나올 일 없을 거야 뉴스에."}]}, {"t": "h3", "x": "안 통한 장면 — 남자 게스트 얘기는 듣기 싫어요"}, {"t": "p", "x": "이상민이 '노빠꾸 3년 장수는 누구 덕이냐'고 물은 뒤, 탁재훈의 취조 방식에 불만이 많다며 '남자 게스트가 오면 녹화를 빨리 끝낸다'는 제보를 내민다. 조사받는 사람이 할 법한 답은 '그렇지 않다'는 해명이다."}, {"t": "v", "src": "영상/y_61GtXtVZ-dE_1.mp4", "poster": "img/y_61GtXtVZ-dE_1.jpg"}, {"t": "dq", "ans": false, "lines": [{"w": "이상민", "x": "그 사람의 얘기를 왜 안 들어주죠?"}, {"w": "탁재훈", "x": "아 듣기 싫어요."}, {"w": "이상민", "x": "여자 게스트 나왔을 때와 남자 게스트들이 나왔을 때의 혈색이 달라요."}]}, {"t": "key", "l": "차이", "x": "아는 형님(2016)에서 이수근이 '뉴스에 내가 메인으로 나와서 형이 서운해하더라'고 놀리자, 탁재훈은 부정하지 않고 '어떻게 네가 나보다 메인이냐'며 정말 서운한 쪽으로 한 칸 더 나갔다. 약점(사건 보도)이 서열 다툼 개그로 바뀌었다. 이상민 편의 '남자 게스트 얘기는 듣기 싫어요'는 인정에서 멈췄다. 그러자 이상민이 '오늘도 낯이 안 좋다'(오늘 게스트도 남자인 자기)로 다음 칸을 가져갔다. ⑩의 핵심은 '인정'이 아니라 인정한 뒤 '더 나가기'다."}], "cut": 8}]}, {"no": "김", "title": "김예원, 3년 뒤 다시", "sub": "2023년과 2026년 같은 사람, 달라진 대화", "meta": "비교 정리", "tags": [], "cards": [{"type": "cover", "blocks": [{"t": "p", "x": "2023년 회차는 갯벌(바닷가) 장면이라는 밈 하나를 '조사'하는 자리였고, 김예원은 '제가 뭐라고'(05:45, 05:48, 08:59)를 되풀이하며 몸을 낮췄다. 3년 뒤 회차에서는 그 2023년 출연 자체가 '재데뷔'(04:38)라는 새 콜백 재료가 되고, 김예원은 '한 가족'(14:12)을 말하며 탁재훈에게 서운함을 털어놓는 사이가 됐다. 진행자 쪽 위트도 밈을 정면으로 부풀리던 방식에서, 상대의 진심을 연기로 읽고 자기들 처지를 낮추는 방식으로 옮겨 갔다."}]}, {"type": "concept", "sec": "", "title": "관계의 변화", "blocks": [{"t": "h3", "x": "2023년 (시즌2 EP.50)"}, {"t": "p", "x": "구면이지만 조심스러운 사이. 김예원은 '종종 이렇게 같이 이렇게 같이 자리한 적이 있다'(13:49)고 하고, 출연 이유로 두 진행자가 '유머러스하게 안 좋은 얘기도 좋게 승화시킬 수 있는 사람'(02:04)이라고 말한다. 자기 밈 이야기에는 '제가 뭐라고 거기다 대고 그렇게 막 얘기를 하겠어요'(05:45)처럼 몸을 낮추고, '마음에 든다 안 든다라는 말 자체를 제 입으로 그 말을 못하겠긴 해요'(07:03)라고 조심한다."}, {"t": "h3", "x": "2026년 (시즌4 EP.54)"}, {"t": "p", "x": "등장하자마자 '노바꾸가 키워낸 반짝 스타입니까?'(04:13), 프로필에서 2023년 출연일이 '재데뷔'(04:36-04:41)로 소개된다. 김예원은 '저는 사실 노바구의 노예예요'(12:39), '저희가 한 가족이 된 이상'(14:12)이라 말하고, 탁재훈의 소주 런칭에 안 불린 서운함(14:44-14:57)까지 꺼낸다. 진행자도 '옛날에 그런 얘기 못 했잖아요'(14:00), '옛날에 이런 얘기도 못 하고 막 입만 삐죽삐죽되고'(14:04)로 변화를 직접 짚는다."}, {"t": "key", "l": "정리", "x": "관계가 '밈의 주인공을 불러 조사하는 사이'에서 '이 프로그램이 키운 동문'으로 바뀌었다. 그래서 2026년 농담의 과녁이 '너의 과거'에서 '잘된 너 vs 그대로인 우리'(13:20-13:28)로 옮겨 간다. 친해지면 상대를 깎는 대신 내 쪽을 깎아 상대의 성장을 축하하는 길이 열린다."}]}, {"type": "concept", "sec": "", "title": "농담의 허용 범위(수위)", "blocks": [{"t": "h3", "x": "2023년 (시즌2 EP.50)"}, {"t": "p", "x": "과녁은 주로 일과 밈. 연기 활동이 '육회까지 밖에 안 나왔어요'(03:15)라 대사가 없다('아니 연기를 하면은 말을 해야지' 03:21), '65살에 성공하시려면'(03:41), '안 하고 있잖아요'(08:29). 몸·나이 쪽은 '45kg 좀 더 나올 것 같은데'(02:43), '시집갈 때가 지났잖아요'(09:11) 정도. 연애 이야기는 김예원이 '약간 같이 하고 싶으시죠'(13:25-13:28)로 먼저 열고, '그건 이제 저랑 쌍방이어야 되잖아요'(12:39)처럼 선을 스스로 긋는다. 비속어는 대화록에 없다."}, {"t": "h3", "x": "2026년 (시즌4 EP.54)"}, {"t": "p", "x": "성형('코도 지금 좀 되게 이렇게' → 김예원 '살짝 올리긴 했어요' 07:15-07:18), 머리를 자르면 이별이냐(07:44-07:46), 이상형 목록을 '너 차였냐?', '딱 바람폈네'(11:41-11:44)로 읽기, 비속어가 섞인 한 줄(11:50), '그럼 몇 회 때 배드신이'(05:42, 화자 불명), 춤 재연에 '애놨는 줄'(20:35)까지 사적인 영역으로 넓어진다. 김예원은 '아니야 아니야'(11:56)로 부인하면서도 자리를 피하지 않고, '그건 맞아요'(11:04)처럼 일부는 인정한다."}, {"t": "key", "l": "정리", "x": "3년 사이 허용 범위가 '일·밈'에서 '몸·연애'로 넓어졌다. 근거는 친해진 관계와 김예원의 받아치는 힘이다. 다만 2026년 질문 중 일부(성형, 이별 추궁, 머리=이별 통념)는 학습 재료로 쓰기 어렵다. 수위가 올라간 것은 관계 덕이지 기술 덕이 아니다 — 학습자는 기술(③ 단정, ⑤ 설정 올라타기)만 가져가고 과녁은 2023년 수준 이하로 둔다."}]}, {"type": "concept", "sec": "", "title": "과거 이야기의 재사용(콜백)", "blocks": [{"t": "h3", "x": "2023년 (시즌2 EP.50)"}, {"t": "p", "x": "과거(갯벌 장면)가 회차의 주제 자체. 약 4분(04:13-08:15) 동안 사진을 준비해 '장면 아니었으면 지금 예원 씨 지금 누가 기억 못 해요'(04:42-04:46), '마지막에 눈 한번 그렇게 뜨면 무조건 500만'(04:50-04:54), 'cg로 갯벌 좀', '갈매기 소리라도'(04:57-05:03)로 정면에서 부풀리고, '솔직히 말하면 누가 더 쫄았습니까'(06:27), '그 일을 이후로 생긴 습관이나 버릇이 있습니까'(06:49)로 직접 묻는다. 회차 안에서는 김예원의 '제가 뭐라고'를 모았다가 '자꾸 뭐라고 뭐라고'(09:02)로 되돌리고, 이상형 '안기고 싶은'(09:29)을 '누구한테 안기고 싶은데'(11:19)로 다시 쓴다."}, {"t": "h3", "x": "2026년 (시즌4 EP.54)"}, {"t": "p", "x": "콜백이 두 겹이다. ① 옛 밈: '그 병은 지금 바닷가에서부터 걸려 있었잖아요'(06:43), '나 눈깔 봤지'·'야 쳐다보지 싸움 난다'(17:26-17:32), ''추워요' 톤'(18:39), '당신의 계절이 왔다고'(18:49), '야 눈을 왜 그렇게 떠?'(20:04). ② 2023년 회차: '재데뷔'(04:36-04:41), 김예원 스스로 '그때 제가 말씀드렸다시피 이상형이 안기고 싶은 사람이라 그랬잖아요'(09:53), 같은 스튜디오에 와서 '처음에 약간 울컥했거든요'(13:14). 회차 안 콜백도 있다: '그 병'(06:36)을 마스크 이야기에서 '병에 걸렸지만'(18:11)으로 다시 쓴다."}, {"t": "key", "l": "정리", "x": "같은 밈이 주제(2023)에서 양념(2026)으로 내려갔다. 2026년에는 밈을 길게 다루지 않고 한 줄씩, 다른 화제(배역, 사람 만나기, 팬 응대, 챌린지)에 얹는다. 오래된 재료일수록 짧게, 다른 이야기에 붙여서 쓴다. 그리고 지난 만남 자체가 새 콜백 재료가 된다 — 게스트가 먼저 '그때 말씀드렸다시피'를 꺼낸 것은 관계가 이어져 있다는 신호다."}]}, {"type": "concept", "sec": "", "title": "질문과 반응의 차이", "blocks": [{"t": "h3", "x": "2023년 (시즌2 EP.50)"}, {"t": "p", "x": "질문이 사건 인터뷰형: '누가 더 쫄았습니까'(06:27), '마음가짐은 어땠어요'(06:41), '과거 예원에게 꼭 하고 싶은 말이 있다면'(07:48). 김예원은 '저는 되게 평화를 원하기 때문에'(07:34-07:37), '10초에 여유를 가지는 사람이 됐으면'(07:50)처럼 진지하게 답한다. 웃음은 진행자가 덫을 놓을 때 난다: 'pd의 마음을 좀 알겠네요' → '완전 알죠' → '어떤 장면이 필요할 것 같습니까'(04:09-04:13)."}, {"t": "h3", "x": "2026년 (시즌4 EP.54)"}, {"t": "p", "x": "질문이 '무엇이 변했나' 확인형: 얼굴(07:11), 머리(07:38-07:43), 조건·이상형(09:17-09:33), 쉬는 날(16:22). 김예원은 휴대폰의 이상형 메모를 직접 꺼내 읽고(10:24-11:11), 질문을 미리 막기도 한다('아 그렇게 물어보면 안 됩니다' 05:32). 진행자는 그 답을 과거 연애의 증거로 거꾸로 읽는다('또 요것도 뭐 망나니 하나 만났었구나' 09:39, '본인 경험담을 다 얘기하는' 10:54, '너 차였냐?' 11:41)."}, {"t": "key", "l": "정리", "x": "2023년엔 질문 하나에 덫 하나였다면, 2026년엔 상대가 내놓는 목록 하나하나를 같은 틀(③ 단정)로 세 번 연달아 읽는다. 상대가 말을 많이 내놓을수록 같은 기술을 반복할 재료가 늘어난다. 반대로 상대가 내 패턴을 알게 되면 미리 막는다(05:32) — 오래된 관계에서는 같은 기술보다 상대가 막는 그 말이 다음 재료가 된다(05:34 '그러면')."}]}, {"type": "concept", "sec": "", "title": "대화 흐름·주도권", "blocks": [{"t": "h3", "x": "2023년 (시즌2 EP.50)"}, {"t": "p", "x": "기본 흐름은 진행자가 쥔 조사(프로필 02:30, 사건 06:24). 그러나 후반 연애 대목에서 김예원이 '약간 같이 하고 싶으시죠'(13:25-13:28), '혹시 뭔가 오늘 좀 적적하신가 싶어 가지고'(13:53), '혹시 심심하시거나요'(14:22)로 진행자를 외로운 사람 역할에 넣고, 진행자 쪽은 '그렇다 그러면 끼워주나요 혹시'(13:40), '그렇게 얘기했는데 누가 갑니까 자존심'(14:31)으로 버틴다(화자 일부 추정). 마지막 '저한테 인센티브 떨어지나요'(15:10)도 김예원이 먼저 꺼낸다."}, {"t": "h3", "x": "2026년 (시즌4 EP.54)"}, {"t": "p", "x": "김예원이 의제를 들고 온다: '그때 다시 전 다시 나올 거예요'(06:59-07:01), 서운한 것(14:44-14:57). 탁재훈은 '아직까지 거기에 올 수 있는'(15:03), '조금 더 주연을 하시고'(15:13)로 한 번 비틀고, 김예원이 한 번 더 누르자('그냥 몰래라도' 15:19) '제가 누구한테 이렇게 부탁하고 이런 걸 좀 싫어해서'(15:24-15:26)라고 진지하게 설명한다. 김예원이 '근데 저희 가족이잖아요. 얼마든지 편하게 부탁하세요'(15:27)로 마무리한다."}, {"t": "key", "l": "정리", "x": "2023년에 김예원이 쥔 주도권은 상황극 안의 놀이였다(진행자를 외로운 사람 역할에 넣기). 2026년에는 실제 관계 문제(초대받지 못함)를 의제로 올린다. 탁재훈의 대응도 놀이(자존심 카드)에서 농담 한 번 + 진심 한 번의 2단으로 바뀐다. 친한 사람의 진짜 서운함은 농담만으로 끝내지 않는다."}]}, {"type": "concept", "sec": "", "title": "탁재훈이 받는 공격과 대응", "blocks": [{"t": "h3", "x": "2023년 (시즌2 EP.50)"}, {"t": "p", "x": "'이별은 왜 왜 한 거예요'에 김예원이 '저한테 물어보시는 거예요 아니면'(09:47)으로 공을 넘기자, 탁재훈은 '나는 이별이 아닌데'(09:50), '난 서류 같은 거 되게 많이 필요해'(09:53)로 이혼을 먼저 인정하고 키운다(⑩). 밈을 놀리는 진행자들에게 김예원은 '그 워딩 쓸 거면 그거 저작권 저한테 있거든요'(05:16)로 소유권을 주장한다."}, {"t": "h3", "x": "2026년 (시즌4 EP.54)"}, {"t": "p", "x": "공격 재료가 탁재훈의 지난 이력(이혼)에서 현재 행동(소주 런칭에 안 부름, 14:44-14:57)으로 바뀐다. 웃음으로 받은 뒤 진심 설명(15:21-15:26). 김예원은 질문을 미리 막고(05:32), 반말로 받아치는 일이 늘었다('죽을래?' 05:36, '아 나 몰라 떨린다 했잖아' 07:56, '아니야 아니야' 11:56 — 그 대상이 탁재훈인지 김예원보다 어린 신규진인지는 대화록으로 가를 수 없다)."}, {"t": "key", "l": "정리", "x": "약점을 찔렸을 때 2023년식 ⑩(먼저 인정하고 키우기)은 '과거의 일'에 잘 맞고, 2026년처럼 '지금의 서운함'에는 농담 뒤 진심이 필요하다. 공격의 종류에 따라 대응의 온도를 바꾼다."}]}, {"type": "tip", "sec": "", "title": "다시 만난 사람과 이야기할 때", "blocks": [{"t": "ul", "items": ["같은 사람의 같은 밈을 두 번째 만날 때는 주제가 아니라 양념으로 쓴다. 2023년 약 4분(04:13-08:15) 다룬 갯벌 장면이 2026년에는 다른 화제에 얹힌 한 줄짜리 콜백 다섯 번(06:43, 17:26, 18:39, 18:49, 20:04)으로 흩어진다.", "지난 만남 자체가 새 콜백 재료가 된다('재데뷔' 04:36-04:41, 김예원 '그때 제가 말씀드렸다시피' 09:53). 다시 만난 사람과는 지난번 대화를 기억해 꺼내는 것만으로 관계가 확인된다.", "상대가 잘됐을 때는 상대를 깎지 않고 내 처지를 깎는다('나는 이렇게 바뀌고 잘 됐는데 너네가 아직도 그 자리에' 13:20, '지하실에 그대로네' 13:28). 감동을 끊으면서도 축하가 된다.", "친한 사람의 진짜 서운함에는 농담 한 번 뒤 진심 한 번(15:03-15:13 → 15:24). 2023년식 '먼저 인정하고 키우기'(09:50)는 지난 일에, 2026년식 2단 대응은 지금의 관계 문제에 맞는다.", "2026년의 높은 수위(성형·이별·바람)는 3년의 관계가 만든 것이다. 학습자는 기술(③ 목록 역추론, ⑤ 설정 올라타기)만 가져가고, 과녁은 2023년 수준(일·말버릇) 이하로 둔다. 콜백 대상이 아직 '움찔한다'(18:56)고 하면 한 번으로 멈춘다.", "상대가 내 패턴을 알면 미리 막는다('아 그렇게 물어보면 안 됩니다' 05:32). 오래된 관계일수록 같은 기술을 되풀이하기보다 상대의 그 차단을 다음 재료로 삼는다."]}]}]}], "lead": "기술을 골라 위아래로 읽습니다. 영상은 상대의 말이 끝난 곳에서 멈춥니다. 내 답을 소리 내어 말한 뒤 정답을 여세요.", "foot": "개인 공부용입니다. 영상은 각 방송사와 유튜브 채널의 것이며, 음성인식으로 받아 적은 글이라 틀린 곳이 있을 수 있습니다."};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\s*\{[^{}]+?\}/g, '');
const TYPE = {pair:'비교', cover:'장', concept:'개념', scene:'장면', tip:'써먹기', caution:'주의', more:'이어서', situation:'상황', closing:'마치며', notice:'안내'};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

let CI = 0, K = 0, dir = 1;
const LB = i => DATA.chapters[i].no || (i + '장');

/* ---------- 목차 ---------- */
function nVideos(ch){ return ch.cards.reduce((a,c)=>a+c.blocks.filter(b=>b.t==='v').length,0); }
function renderHome(){
  const sv = +store.get('tak.tr.ch');
  let resume = '';
  if (sv >= 1 && DATA.chapters[sv]){
    resume = `<button class="resume" data-go="${sv}"><span><small>이어서 보기</small>${esc(LB(sv))} ${esc(DATA.chapters[sv].title)}</span><span>›</span></button>`;
  }
  const tiles = DATA.chapters.map((ch,i)=>{
    if (i===0) return '';
    const tags = (ch.tags||[]).map(t=>`<span class="chip">${esc(t.replace(/^기술 /,''))}</span>`).join('');
    const nv = nVideos(ch);
    return `<button class="tile" data-go="${i}"><span class="no">${esc(ch.no||i)}</span><span class="tx"><b>${esc(ch.title)}</b><span class="s">${esc(ch.sub||'')}</span><span class="m">${ch.meta?esc(ch.meta):(nv?`영상 ${nv}개`:'정리')}</span>${tags?`<span class="chips">${tags}</span>`:''}</span></button>`;
  }).join('');
  $('#home').innerHTML = `
    <div class="hero"><a class="back-book" href="note.html">본편 8장 · 기술 설명 읽기 ›</a><div class="kicker">직접 받아쳐 보는 연습장</div><h1>탁재훈론 훈련장</h1><p>${esc(DATA.lead)}</p></div>
    ${resume}<button class="intro" data-go="0">이 훈련장을 쓰는 법 ›</button>${tiles}
    <p class="foot">${esc(DATA.foot)}<br><a href="note.html">본편 8장 (기술 설명) ›</a> · <a href="book.html">한 페이지로 이어 읽기 ›</a></p>`;
}

/* ---------- 본문 ---------- */
function liHTML(b){
  const tag = b.t === 'ol' ? 'ol' : 'ul';
  return `<${tag} class="li">` + b.items.map(it=>{
    const i = it.indexOf(':');
    if (b.t==='ul' && i>0 && i<=40) return `<li><b>${esc(it.slice(0,i))}</b>${fmt(it.slice(i))}</li>`;
    return `<li>${fmt(it)}</li>`;
  }).join('') + `</${tag}>`;
}
function blockHTML(b){
  switch(b.t){
    case 'p': return `<p>${fmt(b.x)}</p>`;
    case 'note': return `<p class="note">${fmt(b.x)}</p>`;
    case 'ex': return `<div class="ex"><b>예</b>${fmt(b.x)}</div>`;
    case 'q': return `<div class="quote">${b.lines.map(l=>`<p>${fmt(l)}</p>`).join('')}</div>`;
    case 'v': return `<figure><video controls playsinline preload="none" poster="${esc(b.poster)}"${b.stop?` data-stop="${b.stop}"`:''}><source src="${esc(b.src)}" type="video/mp4"></video>${b.stop?'<figcaption class="stopmsg" hidden>상대의 말이 끝난 곳에서 멈췄습니다. 내 답을 소리 내어 말해 본 뒤 아래 정답을 여세요.</figcaption>':''}</figure>`;
    case 'dq': return `<div class="quote dq${b.ans?' ans':''}">${b.lines.map(l=>`<p>${l.w?`<b>${esc(l.w)}</b>`:''}${esc(l.x)}</p>`).join('')}</div>`;
    case 'h3': return `<h3>${esc(b.x)}</h3>`;
    case 'key': return `<div class="ex"><b class="l">${esc(b.l)}</b>${fmt(b.x)}</div>`;
    case 'src': return `<p class="note src">${esc(b.x)}${b.url?` · <a href="${esc(b.url)}" target="_blank" rel="noopener">유튜브 원본 ›</a>`:''}</p>`;
    case 'lk': return `<p class="note lk"><a href="${esc(b.url)}">${esc(b.x)} ›</a></p>`;
    case 'ul': case 'ol': return liHTML(b);
  }
  return '';
}
function titleHTML(t){ return esc(t).replace(/ → /g, '<span class="ar">→</span>'); }
function hasVid(c){ return c.blocks.some(b=>b.t==='v'); }
function sceneNo(ch, k){
  let n = 0;
  for (let i=0;i<=k;i++){ const c = ch.cards[i]; if (c.type==='scene' && hasVid(c)) n++; }
  return n;
}
function kindOf(ch, k){
  const c = ch.cards[k];
  if (c.practice) return '연습 문제';
  if (c.type==='scene' && hasVid(c)) return '장면 ' + sceneNo(ch,k);
  return TYPE[c.type] || '';
}
function segHTML(ch, k){
  const c = ch.cards[k];
  const sec = (c.sec && c.sec !== c.title) ? `<span class="sec">${esc(c.sec)}</span>` : '';
  let body;
  if (c.cut){
    body = c.blocks.slice(0, c.cut).map(blockHTML).join('') + `<button class="reveal">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기</button><div class="answer" hidden>${c.blocks.slice(c.cut).map(blockHTML).join('')}</div>`;
  } else if (c.practice){
    const first = c.blocks[0].t==='p' ? [c.blocks[0]] : [];
    const rest = c.blocks.slice(first.length);
    body = first.map(blockHTML).join('') + `<button class="reveal">내 답을 소리 내어 말한 뒤, 눌러서 정답 보기</button><div class="answer" hidden>${rest.map(blockHTML).join('')}</div>`;
  } else {
    body = c.blocks.map(blockHTML).join('');
  }
  const h2 = c.title ? `<h2>${titleHTML(c.title)}</h2>` : '';
  return `<section class="seg ${c.type}" id="s${k}"><div class="top"><span class="badge ${c.type}">${esc(kindOf(ch,k))}</span>${sec}</div>${h2}${body}</section>`;
}
function headHTML(ch, ci){
  const cv = ch.cards[0] && ch.cards[0].type==='cover' ? ch.cards[0] : null;
  const lead = cv ? cv.blocks.map(blockHTML).join('') : '';
  const tags = (ch.tags||[]).map(t=>`<span class="chip">${esc(t.replace(/^기술 /,''))}</span>`).join('');
  return `<header class="chhead">${ci?`<div class="no">${esc(LB(ci))}</div>`:''}<h1>${esc(ch.title)}</h1><p class="subt">${esc(ch.sub||'')}</p>${lead}${tags?`<div class="chips">${tags}</div>`:''}</header>`;
}
function pageHTML(ci){
  const ch = DATA.chapters[ci];
  let h = headHTML(ch, ci);
  ch.cards.forEach((c,k)=>{ if (c.type!=='cover') h += segHTML(ch,k); });
  const last = ci === DATA.chapters.length-1;
  const prevBtn = ci>1 ? `<button data-go="${ci-1}">‹ ${esc(LB(ci-1))}</button>` : `<button data-go="home">‹ 목차</button>`;
  const nextBtn = !last ? `<button class="nx" data-go="${ci+1}">다음 · ${esc(LB(ci+1))} ${esc(DATA.chapters[ci+1].title)} ›</button>` : `<button class="nx" data-go="home">목차로 ›</button>`;
  return `<div class="page">${h}</div><div class="endnav">${prevBtn}${nextBtn}</div>`;
}

function go(ci, keepScroll){
  CI = ci;
  $('#home').style.display = 'none';
  $('#deck').style.display = 'flex';
  const st = $('#stage');
  st.innerHTML = pageHTML(ci);
  $('#ttl').textContent = (ci?LB(ci)+' ':'') + DATA.chapters[ci].title;
  drawNav(ci);
  let top = 0;
  if (keepScroll){ const s = store.get('tak.tr.sc'); if (s && s.split('/')[0]===String(ci)) top = +s.split('/')[1] || 0; }
  st.scrollTop = top;
  store.set('tak.tr.ch', ci);
  try{ history.replaceState(null, '', '#c' + ci); }catch(e){}
  document.title = DATA.chapters[ci].title + ' · 탁재훈론 훈련장';
  upd();
}
function drawNav(ci){
  $('#chnav').innerHTML = DATA.chapters.map((c,i)=> i===0 ? '' : `<button data-go="${i}" class="${i===ci?'on':''}" aria-label="${i}장 ${esc(c.title)}" title="${esc(c.title)}">${esc(c.no||i)}</button>`).join('');
}
function toHome(){
  $('#deck').style.display = 'none';
  $('#home').style.display = 'block';
  renderHome();
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  document.title = '탁재훈론 훈련장';
}
function upd(){
  const st = $('#stage'), m = st.scrollHeight - st.clientHeight;
  $('#pg').style.width = (m>0 ? Math.min(100, st.scrollTop/m*100) : 0) + '%';
}
let scT = 0;
$('#stage').addEventListener('scroll', () => {
  upd();
  clearTimeout(scT);
  scT = setTimeout(() => store.set('tak.tr.sc', CI + '/' + Math.round($('#stage').scrollTop)), 300);
}, {passive:true});

/* ---------- 목록 시트 ---------- */
function openSheet(){
  const ch = DATA.chapters[CI];
  $('#sbox').innerHTML = `<h3>${CI?esc(LB(CI))+' ':''}${esc(ch.title)}</h3>` + ch.cards.map((c,i)=>{
    if (c.type==='cover') return '';
    const t = c.title || c.sec;
    return `<button data-i="${i}"><span class="k">${esc(kindOf(ch,i))}</span><span class="tt">${esc(t)}</span></button>`;
  }).join('');
  $('#sheet').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); }

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){
    const v = g.dataset.go;
    if (v === 'home') toHome();
    else go(+v, g.classList.contains('resume'));
    return;
  }
  const s = e.target.closest('#sbox button[data-i]');
  if (s){ closeSheet(); const el = document.getElementById('s'+s.dataset.i); if (el) el.scrollIntoView({block:'start'}); return; }
  if (e.target.id === 'sheet'){ closeSheet(); return; }
  const rv = e.target.closest('.reveal');
  if (rv){ const a = rv.nextElementSibling; if (a) a.hidden = false; rv.hidden = true; }
});
$('#back').onclick = toHome;
$('#lst').onclick = openSheet;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#sheet').classList.contains('on')) closeSheet(); else if ($('#deck').style.display === 'flex') toHome(); }
});

const SIZES = [16, 18, 20];
let si = Math.max(0, SIZES.indexOf(+store.get('tak.fs') || 16));
function applySize(){ document.documentElement.style.setProperty('--fs', SIZES[si] + 'px'); }
$('#fs').onclick = () => { si = (si+1) % SIZES.length; store.set('tak.fs', SIZES[si]); applySize(); upd(); };
applySize();

/* ---------- 영상: 상대의 말이 끝난 곳에서 한 번 멈춤 ---------- */
document.addEventListener('timeupdate', e => {
  const v = e.target;
  if (!(v instanceof HTMLVideoElement) || !v.dataset.stop || v.dataset.done) return;
  const st = +v.dataset.stop;
  if (v.currentTime >= st && v.currentTime < st + 2){
    v.pause(); v.dataset.done = '1';
    const m = v.parentNode.querySelector('.stopmsg'); if (m) m.hidden = false;
  }
}, true);

/* ---------- 시작 ---------- */
function oldHash(){
  const m = decodeURIComponent(location.hash).match(/^#\/(?:drill|tech)\/(.)/);
  if (!m) return -1;
  return DATA.chapters.findIndex(c => c.no === m[1]);
}
function route(){
  const o = oldHash();
  if (o > 0){ go(o, false); return; }
  const m = location.hash.match(/^#c(\d+)/);
  if (m && DATA.chapters[+m[1]]) go(+m[1], true);
  else toHome();
}
route();
window.addEventListener('hashchange', () => {
  const o = oldHash(); if (o > 0){ go(o, false); return; }
  const m = location.hash.match(/^#c(\d+)/);
  if (m && DATA.chapters[+m[1]]){ if (+m[1]!==CI || $('#deck').style.display!=='flex') go(+m[1], false); }
  else if ($('#deck').style.display === 'flex') toHome();
});
</script>
</body>
</html>
